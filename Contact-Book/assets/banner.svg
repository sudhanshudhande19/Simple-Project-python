<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1055"/>
      <stop offset="50%" stop-color="#3a1c71"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="100%" stop-color="#fad0c4"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating dots -->
  <g fill="#fad0c4" opacity="0.4">
    <circle cx="75" cy="55" r="9"><animate attributeName="cy" values="55;85;55" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1125" cy="255" r="12"><animate attributeName="cy" values="255;225;255" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="50" r="7"><animate attributeName="cy" values="50;75;50" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- phonebook card -->
  <g transform="translate(80,40)" filter="url(#glow)">
    <rect x="0" y="0" width="195" height="235" rx="16" fill="#1a0f30" stroke="#ff9a9e" stroke-width="3"/>
    <rect x="16" y="16" width="163" height="26" rx="6" fill="#ff9a9e"/>
    <text x="97" y="34" font-family="monospace" font-size="13" fill="#2b1055" text-anchor="middle" font-weight="bold">CONTACTS</text>

    <!-- contact rows, one highlighted -->
    <g font-family="monospace" font-size="12">
      <circle cx="30" cy="62" r="9" fill="url(#avatar)"/>
      <text x="48" y="66" fill="#fff">Rahul</text>
      <text x="178" y="66" text-anchor="end" fill="#9fb3c8">98xxxx01</text>

      <rect x="16" y="78" width="163" height="28" rx="6" fill="#ff9a9e" opacity="0.15">
        <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="30" cy="92" r="9" fill="url(#avatar)"/>
      <text x="48" y="96" fill="#fff">Sudhanshu</text>
      <text x="178" y="96" text-anchor="end" fill="#43e97b">98xxxx19</text>

      <circle cx="30" cy="122" r="9" fill="url(#avatar)"/>
      <text x="48" y="126" fill="#fff">Aditi</text>
      <text x="178" y="126" text-anchor="end" fill="#9fb3c8">97xxxx44</text>

      <circle cx="30" cy="152" r="9" fill="url(#avatar)"/>
      <text x="48" y="156" fill="#fff">Karan</text>
      <text x="178" y="156" text-anchor="end" fill="#9fb3c8">99xxxx82</text>
    </g>

    <rect x="16" y="180" width="163" height="36" rx="18" fill="#43e97b" opacity="0.15" stroke="#43e97b" stroke-width="1.5"/>
    <text x="97" y="203" font-family="monospace" font-size="12" fill="#43e97b" text-anchor="middle">+ Add Contact</text>
  </g>

  <!-- title -->
  <text x="320" y="130" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="70" fill="url(#title)" filter="url(#glow)">CONTACT BOOK</text>
  <text x="324" y="180" font-family="monospace" font-size="24" fill="#e8dcff">Add · View · Search · Update · Delete</text>
  <text x="324" y="216" font-family="monospace" font-size="20" fill="#fad0c4">&gt; python contact_book.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#ff9a9e" stroke-opacity="0.4" stroke-width="2"/>
</svg>
