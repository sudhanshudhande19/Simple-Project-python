<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5bc0eb"/>
      <stop offset="100%" stop-color="#9bf6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating grad caps / sparkles -->
  <g fill="#9bf6ff" opacity="0.45">
    <circle cx="70" cy="55" r="8"><animate attributeName="cy" values="55;80;55" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="255" r="11"><animate attributeName="cy" values="255;230;255" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="55" r="7"><animate attributeName="cy" values="55;80;55" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- graduation cap icon -->
  <g transform="translate(95,75)" filter="url(#glow)">
    <polygon points="90,0 180,35 90,70 0,35" fill="#5bc0eb"/>
    <polygon points="90,70 160,45 160,85 90,105 20,85 20,45" fill="#3a7ca5"/>
    <circle cx="170" cy="40" r="3" fill="#ffd700"/>
    <line x1="170" y1="40" x2="170" y2="90" stroke="#ffd700" stroke-width="2">
      <animate attributeName="y2" values="90;95;90" dur="2s" repeatCount="indefinite"/>
    </line>
    <circle cx="170" cy="93" r="5" fill="#ffd700">
      <animate attributeName="cy" values="93;98;93" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- record card -->
  <g transform="translate(80,195)" filter="url(#glow)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#0d1b2a" stroke="#5bc0eb" stroke-width="2"/>
    <g font-family="monospace" font-size="12" fill="#cfe8ef">
      <text x="14" y="22">Name  : Sudhanshu</text>
      <text x="14" y="42">Marks : 88</text>
      <text x="14" y="62" fill="#43e97b">Grade : A</text>
    </g>
  </g>

  <!-- title -->
  <text x="330" y="110" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="50" fill="url(#title)" filter="url(#glow)">STUDENT RECORD</text>
  <text x="330" y="165" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="50" fill="url(#title)" filter="url(#glow)">MANAGEMENT SYSTEM</text>
  <text x="334" y="205" font-family="monospace" font-size="22" fill="#cfe8ef">Add · Search · Update · Grade · Save</text>
  <text x="334" y="245" font-family="monospace" font-size="20" fill="#9bf6ff">&gt; python main.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#5bc0eb" stroke-opacity="0.4" stroke-width="2"/>
</svg>
