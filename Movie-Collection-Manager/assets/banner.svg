<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#1a0b1f"/>
      <stop offset="100%" stop-color="#2d0f1a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ffc107"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- film strip top & bottom -->
  <g fill="#ffc107" opacity="0.35">
    <rect x="30" y="14" width="18" height="10" rx="2"/><rect x="70" y="14" width="18" height="10" rx="2"/><rect x="110" y="14" width="18" height="10" rx="2"/><rect x="150" y="14" width="18" height="10" rx="2"/><rect x="190" y="14" width="18" height="10" rx="2"/><rect x="230" y="14" width="18" height="10" rx="2"/><rect x="270" y="14" width="18" height="10" rx="2"/><rect x="310" y="14" width="18" height="10" rx="2"/><rect x="350" y="14" width="18" height="10" rx="2"/><rect x="390" y="14" width="18" height="10" rx="2"/><rect x="430" y="14" width="18" height="10" rx="2"/><rect x="470" y="14" width="18" height="10" rx="2"/><rect x="510" y="14" width="18" height="10" rx="2"/><rect x="550" y="14" width="18" height="10" rx="2"/><rect x="590" y="14" width="18" height="10" rx="2"/><rect x="630" y="14" width="18" height="10" rx="2"/><rect x="670" y="14" width="18" height="10" rx="2"/><rect x="710" y="14" width="18" height="10" rx="2"/><rect x="750" y="14" width="18" height="10" rx="2"/><rect x="790" y="14" width="18" height="10" rx="2"/><rect x="830" y="14" width="18" height="10" rx="2"/><rect x="870" y="14" width="18" height="10" rx="2"/><rect x="910" y="14" width="18" height="10" rx="2"/><rect x="950" y="14" width="18" height="10" rx="2"/><rect x="990" y="14" width="18" height="10" rx="2"/><rect x="1030" y="14" width="18" height="10" rx="2"/><rect x="1070" y="14" width="18" height="10" rx="2"/><rect x="1110" y="14" width="18" height="10" rx="2"/><rect x="1150" y="14" width="18" height="10" rx="2"/>
    <rect x="30" y="296" width="18" height="10" rx="2"/><rect x="70" y="296" width="18" height="10" rx="2"/><rect x="110" y="296" width="18" height="10" rx="2"/><rect x="150" y="296" width="18" height="10" rx="2"/><rect x="190" y="296" width="18" height="10" rx="2"/><rect x="230" y="296" width="18" height="10" rx="2"/><rect x="270" y="296" width="18" height="10" rx="2"/><rect x="310" y="296" width="18" height="10" rx="2"/><rect x="350" y="296" width="18" height="10" rx="2"/><rect x="390" y="296" width="18" height="10" rx="2"/><rect x="430" y="296" width="18" height="10" rx="2"/><rect x="470" y="296" width="18" height="10" rx="2"/><rect x="510" y="296" width="18" height="10" rx="2"/><rect x="550" y="296" width="18" height="10" rx="2"/><rect x="590" y="296" width="18" height="10" rx="2"/><rect x="630" y="296" width="18" height="10" rx="2"/><rect x="670" y="296" width="18" height="10" rx="2"/><rect x="710" y="296" width="18" height="10" rx="2"/><rect x="750" y="296" width="18" height="10" rx="2"/><rect x="790" y="296" width="18" height="10" rx="2"/><rect x="830" y="296" width="18" height="10" rx="2"/><rect x="870" y="296" width="18" height="10" rx="2"/><rect x="910" y="296" width="18" height="10" rx="2"/><rect x="950" y="296" width="18" height="10" rx="2"/><rect x="990" y="296" width="18" height="10" rx="2"/><rect x="1030" y="296" width="18" height="10" rx="2"/><rect x="1070" y="296" width="18" height="10" rx="2"/><rect x="1110" y="296" width="18" height="10" rx="2"/><rect x="1150" y="296" width="18" height="10" rx="2"/>
  </g>

  <!-- floating sparkles -->
  <g fill="#ff1744" opacity="0.4">
    <circle cx="60" cy="70" r="8"><animate attributeName="cy" values="70;95;70" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1135" cy="245" r="11"><animate attributeName="cy" values="245;220;245" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- movie poster card -->
  <g transform="translate(90,45)" filter="url(#glow)">
    <rect x="0" y="0" width="180" height="230" rx="14" fill="#14090f" stroke="#ffc107" stroke-width="3"/>
    <rect x="14" y="14" width="152" height="110" rx="8" fill="#2d0f1a" stroke="#ff1744" stroke-width="1.5"/>
    <!-- play button -->
    <circle cx="90" cy="69" r="26" fill="#ff1744" opacity="0.9">
      <animate attributeName="r" values="26;30;26" dur="2s" repeatCount="indefinite"/>
    </circle>
    <polygon points="82,55 82,83 106,69" fill="#fff"/>
    <text x="90" y="148" font-family="monospace" font-size="14" fill="#ffc107" text-anchor="middle" font-weight="bold">3 Idiots</text>
    <text x="90" y="166" font-family="monospace" font-size="11" fill="#cfe8ef" text-anchor="middle">2009 · Comedy · Hindi</text>
    <text x="90" y="190" font-family="monospace" font-size="16" fill="#ffc107" text-anchor="middle">★★★★★
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="212" font-family="monospace" font-size="11" fill="#43e97b" text-anchor="middle">IMDb 8.4 · Favourite ♥</text>
  </g>

  <!-- title -->
  <text x="320" y="125" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="58" fill="url(#title)" filter="url(#glow)">MOVIE COLLECTION</text>
  <text x="320" y="185" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="58" fill="url(#title)" filter="url(#glow)">MANAGER</text>
  <text x="324" y="220" font-family="monospace" font-size="22" fill="#e6dcff">Add · Search · Update · Favourites · Watched</text>
  <text x="324" y="258" font-family="monospace" font-size="20" fill="#ffc107">&gt; python movie_collection.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#ff1744" stroke-opacity="0.4" stroke-width="2"/>
</svg>
