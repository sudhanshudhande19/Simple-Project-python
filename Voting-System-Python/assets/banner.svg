<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="50%" stop-color="#2c1250"/>
      <stop offset="100%" stop-color="#0f2042"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff512f"/>
      <stop offset="100%" stop-color="#f09819"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating sparkles -->
  <g fill="#f09819" opacity="0.45">
    <circle cx="70" cy="55" r="8"><animate attributeName="cy" values="55;80;55" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="255" r="11"><animate attributeName="cy" values="255;230;255" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="55" r="7"><animate attributeName="cy" values="55;80;55" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ballot box -->
  <g transform="translate(90,70)" filter="url(#glow)">
    <rect x="0" y="40" width="170" height="130" rx="10" fill="#1e1035" stroke="#f09819" stroke-width="3"/>
    <rect x="0" y="40" width="170" height="20" rx="6" fill="#ff512f"/>
    <rect x="65" y="40" width="40" height="8" rx="3" fill="#1e1035"/>
    <!-- ballot slip dropping -->
    <rect x="70" y="-10" width="30" height="40" rx="3" fill="#fff" stroke="#0d1b2a" stroke-width="1.5">
      <animate attributeName="y" values="-30;40;-30" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="85" y="8" font-family="monospace" font-size="10" fill="#1e1035" text-anchor="middle">✓
      <animate attributeName="y" values="-15;55;-15" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="85" y="130" font-family="monospace" font-size="14" fill="#f09819" text-anchor="middle" font-weight="bold">BALLOT</text>
  </g>

  <!-- results mini bars -->
  <g transform="translate(60,220)" font-family="monospace" font-size="11" fill="#cfe8ef">
    <text x="0" y="12">Priya</text>
    <rect x="50" y="2" width="90" height="10" rx="3" fill="#43e97b"/>
    <text x="0" y="30">Rahul</text>
    <rect x="50" y="20" width="60" height="10" rx="3" fill="#4facfe"/>
  </g>

  <!-- title -->
  <text x="320" y="130" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="62" fill="url(#title)" filter="url(#glow)">VOTING SYSTEM</text>
  <text x="324" y="180" font-family="monospace" font-size="26" fill="#e6dcff">Vote · Count · Winner · Tie Detection</text>
  <text x="324" y="216" font-family="monospace" font-size="16" fill="#9fb3c8">Age &amp; Voter ID validation · No duplicate votes</text>
  <text x="324" y="252" font-family="monospace" font-size="20" fill="#f09819">&gt; python voting_system.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#f09819" stroke-opacity="0.4" stroke-width="2"/>
</svg>
