<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#243b55"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="33%" stop-color="#43e97b"/>
      <stop offset="66%" stop-color="#f9d423"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating bubbles -->
  <g fill="#38f9d7" opacity="0.35">
    <circle cx="70" cy="60" r="9"><animate attributeName="cy" values="60;90;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="260" r="13"><animate attributeName="cy" values="260;230;260" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="55" r="8"><animate attributeName="cy" values="55;80;55" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scale / gauge card -->
  <g transform="translate(80,50)" filter="url(#glow)">
    <rect x="0" y="0" width="190" height="220" rx="20" fill="#0d1b2a" stroke="#43e97b" stroke-width="3"/>
    <rect x="22" y="20" width="146" height="70" rx="10" fill="#06121c" stroke="#38f9d7" stroke-width="2"/>
    <text x="95" y="66" font-family="monospace" font-size="30" fill="#43e97b" text-anchor="middle">22.86
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <!-- gauge -->
    <path d="M 35 170 A 60 60 0 0 1 155 170" fill="none" stroke="url(#bar)" stroke-width="14" stroke-linecap="round"/>
    <g transform="translate(95,170)">
      <line x1="0" y1="0" x2="0" y2="-48" stroke="#fff" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-50;-15;-30;-15" dur="4s" repeatCount="indefinite"/>
      </line>
      <circle r="7" fill="#fff"/>
    </g>
    <text x="95" y="205" font-family="monospace" font-size="14" fill="#9fb3c8" text-anchor="middle">BMI</text>
  </g>

  <!-- title -->
  <text x="320" y="150" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="76" fill="url(#title)" filter="url(#glow)">BMI CALCULATOR</text>
  <text x="324" y="198" font-family="monospace" font-size="26" fill="#cfe8ef">Weight · Height · BMI · Category</text>

  <!-- category bar -->
  <rect x="324" y="220" width="620" height="12" rx="6" fill="url(#bar)"/>
  <circle cy="226" r="10" fill="#fff" stroke="#0d1b2a" stroke-width="3">
    <animate attributeName="cx" values="360;620;480;620" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g font-family="monospace" font-size="15" fill="#9fb3c8">
    <text x="324" y="256">Underweight</text>
    <text x="500" y="256">Normal</text>
    <text x="660" y="256">Overweight</text>
    <text x="860" y="256">Obese</text>
  </g>
  <text x="324" y="292" font-family="monospace" font-size="20" fill="#f9d423">&gt; python bmi_calculator.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#43e97b" stroke-opacity="0.4" stroke-width="2"/>
</svg>
