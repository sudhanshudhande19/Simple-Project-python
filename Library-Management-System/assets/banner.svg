<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1055"/>
      <stop offset="50%" stop-color="#3a1c71"/>
      <stop offset="100%" stop-color="#1e2a78"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9a00"/>
      <stop offset="100%" stop-color="#ffd76a"/>
    </linearGradient>
    <linearGradient id="book1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5f6d"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="book2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#1c8a52"/>
    </linearGradient>
    <linearGradient id="book3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#1867b0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating sparkles -->
  <g fill="#ffd76a" opacity="0.5">
    <circle cx="75" cy="55" r="8"><animate attributeName="cy" values="55;80;55" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="255" r="11"><animate attributeName="cy" values="255;230;255" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="60" r="7"><animate attributeName="cy" values="60;85;60" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- bookshelf -->
  <g transform="translate(80,60)" filter="url(#glow)">
    <rect x="0" y="120" width="210" height="14" rx="4" fill="#5b3a29"/>
    <!-- standing books -->
    <g>
      <rect x="10" y="30" width="24" height="90" fill="url(#book1)" stroke="#fff2" stroke-width="1">
        <animateTransform attributeName="transform" type="skewX" values="0;-3;0" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="38" y="15" width="24" height="105" fill="url(#book2)" stroke="#fff2" stroke-width="1"/>
      <rect x="66" y="40" width="24" height="80" fill="url(#book3)" stroke="#fff2" stroke-width="1"/>
      <rect x="94" y="22" width="24" height="98" fill="url(#book1)" stroke="#fff2" stroke-width="1" opacity="0.85"/>
      <rect x="122" y="35" width="24" height="85" fill="url(#book2)" stroke="#fff2" stroke-width="1" opacity="0.85"/>
    </g>
    <!-- open book flying out -->
    <g transform="translate(150,50)">
      <path d="M0 20 Q 20 0 40 20 L 40 55 Q 20 40 0 55 Z" fill="#ffd76a" stroke="#0d1b2a" stroke-width="1.5">
        <animateTransform attributeName="transform" type="translate" values="0,20; -6,0; 0,20" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- title -->
  <text x="330" y="140" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="58" fill="url(#title)" filter="url(#glow)">LIBRARY MANAGEMENT</text>
  <text x="330" y="195" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="58" fill="url(#title)" filter="url(#glow)">SYSTEM</text>
  <text x="334" y="230" font-family="monospace" font-size="22" fill="#e6dcff">Add · Search · Issue · Return · Delete Books</text>
  <text x="334" y="266" font-family="monospace" font-size="20" fill="#ffd76a">&gt; python library_management.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#ff9a00" stroke-opacity="0.4" stroke-width="2"/>
</svg>
