<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#2c5364"/>
      <stop offset="100%" stop-color="#1c1c3c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5af19"/>
      <stop offset="100%" stop-color="#f12711"/>
    </linearGradient>
    <linearGradient id="note1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>
    <linearGradient id="note2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7ffeb"/>
      <stop offset="100%" stop-color="#64ffda"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating sparkles -->
  <g fill="#f5af19" opacity="0.45">
    <circle cx="70" cy="55" r="8"><animate attributeName="cy" values="55;80;55" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="255" r="11"><animate attributeName="cy" values="255;230;255" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="55" r="7"><animate attributeName="cy" values="55;80;55" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- stack of sticky notes -->
  <g transform="translate(90,55)" filter="url(#soft-shadow)">
    <g transform="rotate(-8 100 110)">
      <rect x="20" y="30" width="150" height="150" rx="8" fill="url(#note2)"/>
    </g>
    <g transform="rotate(6 100 110)">
      <rect x="20" y="30" width="150" height="150" rx="8" fill="#ff8a65"/>
    </g>
    <g filter="url(#glow)">
      <rect x="20" y="30" width="150" height="150" rx="8" fill="url(#note1)"/>
      <line x1="38" y1="70" x2="152" y2="70" stroke="#8d6e00" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="95" x2="152" y2="95" stroke="#8d6e00" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="120" x2="120" y2="120" stroke="#8d6e00" stroke-width="3" stroke-linecap="round"/>
      <!-- pencil writing -->
      <g>
        <line x1="38" y1="150" x2="38" y2="150" stroke="#8d6e00" stroke-width="3" stroke-linecap="round">
          <animate attributeName="x2" values="38;145;38" dur="3s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </g>

  <!-- title -->
  <text x="330" y="140" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="76" fill="url(#title)" filter="url(#glow)">NOTES APP</text>
  <text x="334" y="190" font-family="monospace" font-size="26" fill="#cfe8ef">Add · View · Search · Delete Notes</text>
  <text x="334" y="228" font-family="monospace" font-size="16" fill="#9fb3c8">Stored permanently in data.txt</text>
  <text x="334" y="264" font-family="monospace" font-size="20" fill="#f5af19">&gt; python notes.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#f5af19" stroke-opacity="0.4" stroke-width="2"/>
</svg>
