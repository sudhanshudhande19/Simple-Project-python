<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating sparkles -->
  <g fill="#ffd200" opacity="0.45">
    <circle cx="70" cy="55" r="8"><animate attributeName="cy" values="55;80;55" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="255" r="11"><animate attributeName="cy" values="255;230;255" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="55" r="7"><animate attributeName="cy" values="55;80;55" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- report card -->
  <g transform="translate(85,45)" filter="url(#glow)">
    <rect x="0" y="0" width="195" height="235" rx="16" fill="#0d1b2a" stroke="#ffd200" stroke-width="3"/>
    <rect x="16" y="16" width="163" height="26" rx="6" fill="#ffd200"/>
    <text x="97" y="34" font-family="monospace" font-size="13" fill="#0d1b2a" text-anchor="middle" font-weight="bold">REPORT CARD</text>

    <g font-family="monospace" font-size="11" fill="#cfe8ef">
      <text x="20" y="64">Python</text><text x="175" y="64" text-anchor="end" fill="#43e97b">90</text>
      <text x="20" y="82">Java</text><text x="175" y="82" text-anchor="end" fill="#43e97b">85</text>
      <text x="20" y="100">SQL</text><text x="175" y="100" text-anchor="end" fill="#43e97b">80</text>
      <text x="20" y="118">PHP</text><text x="175" y="118" text-anchor="end" fill="#43e97b">75</text>
      <text x="20" y="136">DBMS</text><text x="175" y="136" text-anchor="end" fill="#43e97b">88</text>
      <line x1="20" y1="146" x2="175" y2="146" stroke="#334" stroke-width="1"/>
    </g>

    <text x="20" y="166" font-family="monospace" font-size="12" fill="#9fb3c8">Percentage</text>
    <text x="175" y="166" font-family="monospace" font-size="12" fill="#ffd200" text-anchor="end">83.6%</text>

    <rect x="16" y="178" width="163" height="40" rx="8" fill="#0a1522" stroke="#43e97b" stroke-width="1.5"/>
    <text x="97" y="195" font-family="monospace" font-size="11" fill="#9fb3c8" text-anchor="middle">GRADE</text>
    <text x="97" y="212" font-family="monospace" font-size="16" fill="#43e97b" text-anchor="middle" font-weight="bold">A — PASS
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- title -->
  <text x="320" y="130" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="52" fill="url(#title)" filter="url(#glow)">STUDENT GRADE</text>
  <text x="320" y="185" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="52" fill="url(#title)" filter="url(#glow)">CALCULATOR</text>
  <text x="324" y="220" font-family="monospace" font-size="22" fill="#cfe8ef">Total · Percentage · Grade · Pass/Fail</text>
  <text x="324" y="256" font-family="monospace" font-size="20" fill="#ffd200">&gt; python grade_calculator.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#ffd200" stroke-opacity="0.4" stroke-width="2"/>
</svg>
