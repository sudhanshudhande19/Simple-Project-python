<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7b733"/>
      <stop offset="100%" stop-color="#fc4a1a"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#f7b733"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating coins -->
  <g fill="url(#coin)" opacity="0.6">
    <circle cx="75" cy="55" r="10"><animate attributeName="cy" values="55;85;55" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1125" cy="255" r="13"><animate attributeName="cy" values="255;225;255" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="50" r="8"><animate attributeName="cy" values="50;75;50" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="265" r="11"><animate attributeName="cy" values="265;240;265" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- payslip card -->
  <g transform="translate(80,40)" filter="url(#glow)">
    <rect x="0" y="0" width="195" height="235" rx="16" fill="#0d1b2a" stroke="#f7b733" stroke-width="3"/>
    <rect x="16" y="16" width="163" height="28" rx="6" fill="#f7b733"/>
    <text x="97" y="36" font-family="monospace" font-size="14" fill="#0d1b2a" text-anchor="middle" font-weight="bold">PAYSLIP</text>

    <g font-family="monospace" font-size="12" fill="#cfe8ef">
      <text x="20" y="70">Basic</text><text x="175" y="70" text-anchor="end" fill="#43e97b">30000</text>
      <text x="20" y="90">HRA</text><text x="175" y="90" text-anchor="end" fill="#43e97b">5000</text>
      <text x="20" y="110">Bonus</text><text x="175" y="110" text-anchor="end" fill="#43e97b">2000</text>
      <line x1="20" y1="120" x2="175" y2="120" stroke="#334" stroke-width="1"/>
      <text x="20" y="138">PF</text><text x="175" y="138" text-anchor="end" fill="#ff4b2b">1800</text>
      <text x="20" y="158">Tax</text><text x="175" y="158" text-anchor="end" fill="#ff4b2b">1000</text>
    </g>

    <rect x="16" y="175" width="163" height="42" rx="6" fill="#0a1522" stroke="#43e97b" stroke-width="1.5"/>
    <text x="97" y="192" font-family="monospace" font-size="11" fill="#9fb3c8" text-anchor="middle">NET SALARY</text>
    <text x="97" y="209" font-family="monospace" font-size="16" fill="#43e97b" text-anchor="middle" font-weight="bold">₹ 39200
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- title -->
  <text x="330" y="130" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="56" fill="url(#title)" filter="url(#glow)">EMPLOYEE SALARY</text>
  <text x="330" y="185" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="56" fill="url(#title)" filter="url(#glow)">CALCULATOR</text>
  <text x="334" y="220" font-family="monospace" font-size="22" fill="#cfe8ef">Gross · Deductions · Net Salary · Multi-Employee</text>
  <text x="334" y="256" font-family="monospace" font-size="20" fill="#f7b733">&gt; python employee_salary.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#f7b733" stroke-opacity="0.4" stroke-width="2"/>
</svg>
