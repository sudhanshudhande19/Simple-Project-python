<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3443"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#76ff03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating operator symbols -->
  <g font-family="monospace" font-size="26" fill="#00e5ff" opacity="0.5">
    <text x="60" y="60">+<animate attributeName="y" values="60;90;60" dur="4s" repeatCount="indefinite"/></text>
    <text x="1120" y="250">÷<animate attributeName="y" values="250;220;250" dur="5s" repeatCount="indefinite"/></text>
    <text x="1040" y="55">×<animate attributeName="y" values="55;80;55" dur="3.5s" repeatCount="indefinite"/></text>
    <text x="140" y="260">−<animate attributeName="y" values="260;235;260" dur="4.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- calculator body -->
  <g transform="translate(90,40)" filter="url(#glow)">
    <rect x="0" y="0" width="190" height="240" rx="18" fill="#101820" stroke="#00e5ff" stroke-width="3"/>
    <rect x="16" y="16" width="158" height="50" rx="8" fill="#000" stroke="#76ff03" stroke-width="2"/>
    <text x="165" y="50" font-family="monospace" font-size="22" fill="#76ff03" text-anchor="end">42
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <g fill="#1f2a35" stroke="#00e5ff" stroke-width="1">
      <rect x="16" y="78" width="34" height="30" rx="5"/><rect x="58" y="78" width="34" height="30" rx="5"/><rect x="100" y="78" width="34" height="30" rx="5"/><rect x="142" y="78" width="32" height="30" rx="5" fill="#0f3443"/>
      <rect x="16" y="116" width="34" height="30" rx="5"/><rect x="58" y="116" width="34" height="30" rx="5"/><rect x="100" y="116" width="34" height="30" rx="5"/><rect x="142" y="116" width="32" height="30" rx="5" fill="#0f3443"/>
      <rect x="16" y="154" width="34" height="30" rx="5"/><rect x="58" y="154" width="34" height="30" rx="5"/><rect x="100" y="154" width="34" height="30" rx="5"/><rect x="142" y="154" width="32" height="30" rx="5" fill="#0f3443"/>
      <rect x="16" y="192" width="76" height="30" rx="5"/><rect x="100" y="192" width="34" height="30" rx="5"/><rect x="142" y="192" width="32" height="30" rx="5" fill="#0f3443"/>
    </g>
    <g font-family="monospace" font-size="13" fill="#cfe8ef" text-anchor="middle">
      <text x="33" y="97">7</text><text x="75" y="97">8</text><text x="117" y="97">9</text><text x="158" y="97" fill="#76ff03">÷</text>
      <text x="33" y="135">4</text><text x="75" y="135">5</text><text x="117" y="135">6</text><text x="158" y="135" fill="#76ff03">×</text>
      <text x="33" y="173">1</text><text x="75" y="173">2</text><text x="117" y="173">3</text><text x="158" y="173" fill="#76ff03">−</text>
      <text x="117" y="211">=</text><text x="158" y="211" fill="#76ff03">+</text>
    </g>
  </g>

  <!-- title -->
  <text x="330" y="140" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="66" fill="url(#title)" filter="url(#glow)">SIMPLE CALCULATOR</text>
  <text x="334" y="190" font-family="monospace" font-size="26" fill="#cfe8ef">+ − × ÷ % ** // and Error Handling</text>
  <text x="334" y="226" font-family="monospace" font-size="20" fill="#76ff03">&gt; python calculator.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="2"/>
</svg>
