<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="50%" stop-color="#330066"/>
      <stop offset="100%" stop-color="#1a0b3d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating sparkles -->
  <g fill="#a855f7" opacity="0.5">
    <circle cx="70" cy="55" r="8"><animate attributeName="cy" values="55;80;55" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="255" r="11"><animate attributeName="cy" values="255;230;255" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="55" r="7"><animate attributeName="cy" values="55;80;55" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- quiz card -->
  <g transform="translate(80,45)" filter="url(#glow)">
    <rect x="0" y="0" width="210" height="230" rx="16" fill="#140527" stroke="#a855f7" stroke-width="3"/>
    <text x="105" y="35" font-family="monospace" font-size="16" fill="#ec4899" text-anchor="middle" font-weight="bold">Q1 of 10</text>
    <text x="20" y="62" font-family="monospace" font-size="12" fill="#e6dcff">Who created Python?</text>

    <g font-family="monospace" font-size="12">
      <rect x="18" y="80" width="174" height="26" rx="6" fill="#2a0e4a" stroke="#4c1d95" stroke-width="1"/>
      <text x="26" y="98" fill="#cfe8ef">A) Dennis Ritchie</text>

      <rect x="18" y="112" width="174" height="26" rx="6" fill="#2a0e4a" stroke="#4c1d95" stroke-width="1"/>
      <text x="26" y="130" fill="#cfe8ef">B) James Gosling</text>

      <rect x="18" y="144" width="174" height="26" rx="6" fill="#1c8a52" stroke="#43e97b" stroke-width="2">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="26" y="162" fill="#eafff3" font-weight="bold">C) Guido van Rossum ✓</text>

      <rect x="18" y="176" width="174" height="26" rx="6" fill="#2a0e4a" stroke="#4c1d95" stroke-width="1"/>
      <text x="26" y="194" fill="#cfe8ef">D) Bjarne Stroustrup</text>
    </g>

    <text x="105" y="218" font-family="monospace" font-size="13" fill="#43e97b" text-anchor="middle">Correct!</text>
  </g>

  <!-- title -->
  <text x="330" y="140" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="70" fill="url(#title)" filter="url(#glow)">QUIZ APPLICATION</text>
  <text x="334" y="190" font-family="monospace" font-size="26" fill="#e6dcff">10 Python MCQs · Score · Percentage</text>
  <text x="334" y="228" font-family="monospace" font-size="16" fill="#9fb3c8">Name &amp; Roll No tracked · Instant feedback</text>
  <text x="334" y="264" font-family="monospace" font-size="20" fill="#a855f7">&gt; python quiz_application.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="2"/>
</svg>
