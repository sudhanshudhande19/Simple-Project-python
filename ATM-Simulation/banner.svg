<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7971e"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating coins -->
  <g fill="#ffd200" opacity="0.5">
    <circle cx="80" cy="60" r="10"><animate attributeName="cy" values="60;90;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="250" r="14"><animate attributeName="cy" values="250;220;250" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="60" r="8"><animate attributeName="cy" values="60;85;60" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="260" r="12"><animate attributeName="cy" values="260;235;260" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ATM machine -->
  <g transform="translate(90,50)" filter="url(#glow)">
    <rect x="0" y="0" width="170" height="220" rx="18" fill="#1b2a35" stroke="#00f5a0" stroke-width="3"/>
    <rect x="18" y="18" width="134" height="70" rx="8" fill="#06141b" stroke="#00d9f5" stroke-width="2"/>
    <text x="85" y="60" font-family="monospace" font-size="20" fill="#00f5a0" text-anchor="middle">₹ 50000
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <g fill="#2c5364" stroke="#00d9f5" stroke-width="1">
      <rect x="22" y="104" width="30" height="22" rx="4"/><rect x="70" y="104" width="30" height="22" rx="4"/><rect x="118" y="104" width="30" height="22" rx="4"/>
      <rect x="22" y="134" width="30" height="22" rx="4"/><rect x="70" y="134" width="30" height="22" rx="4"/><rect x="118" y="134" width="30" height="22" rx="4"/>
    </g>
    <rect x="22" y="176" width="126" height="10" rx="5" fill="#000"/>
    <!-- card sliding -->
    <rect x="35" y="150" width="100" height="60" rx="8" fill="url(#card)" opacity="0">
      <animate attributeName="y" values="120;172;172" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title -->
  <text x="320" y="150" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="76" fill="url(#title)" filter="url(#glow)">ATM SIMULATION</text>
  <text x="324" y="200" font-family="monospace" font-size="26" fill="#cfe8ef">A simple Python project: PIN · Balance · Deposit · Withdraw</text>
  <text x="324" y="245" font-family="monospace" font-size="22" fill="#ffd200">&gt; python atm.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#00f5a0" stroke-opacity="0.4" stroke-width="2"/>
</svg>
