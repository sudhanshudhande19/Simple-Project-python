<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="50%" stop-color="#1b2735"/>
      <stop offset="100%" stop-color="#243b55"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c9ff"/>
      <stop offset="100%" stop-color="#92fe9d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- floating sparkles -->
  <g fill="#92fe9d" opacity="0.45">
    <circle cx="70" cy="55" r="8"><animate attributeName="cy" values="55;80;55" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="255" r="11"><animate attributeName="cy" values="255;230;255" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="55" r="7"><animate attributeName="cy" values="55;80;55" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- checklist card -->
  <g transform="translate(85,45)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="200" height="235" rx="16" fill="#0d1b2a" stroke="#00c9ff" stroke-width="3"/>
    <rect x="16" y="16" width="168" height="24" rx="6" fill="#00c9ff"/>
    <text x="100" y="33" font-family="monospace" font-size="13" fill="#0d1b2a" text-anchor="middle" font-weight="bold">TO-DO LIST</text>

    <g font-family="monospace" font-size="13" fill="#cfe8ef">
      <rect x="18" y="56" width="16" height="16" rx="3" fill="none" stroke="#92fe9d" stroke-width="2"/>
      <path d="M20 64 L25 69 L32 59" stroke="#92fe9d" stroke-width="2" fill="none"/>
      <text x="42" y="68" text-decoration="line-through" fill="#7a8a99">Learn Python</text>

      <rect x="18" y="86" width="16" height="16" rx="3" fill="none" stroke="#92fe9d" stroke-width="2"/>
      <path d="M20 94 L25 99 L32 89" stroke="#92fe9d" stroke-width="2" fill="none"/>
      <text x="42" y="98" text-decoration="line-through" fill="#7a8a99">Build Projects</text>

      <rect x="18" y="116" width="16" height="16" rx="3" fill="none" stroke="#f9d423" stroke-width="2">
        <animate attributeName="stroke" values="#f9d423;#00c9ff;#f9d423" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="42" y="128">Push to GitHub</text>

      <rect x="18" y="146" width="16" height="16" rx="3" fill="none" stroke="#7a8a99" stroke-width="2"/>
      <text x="42" y="158">Practice DSA</text>
    </g>

    <rect x="16" y="190" width="168" height="30" rx="15" fill="#06141b" stroke="#92fe9d" stroke-width="1.5"/>
    <text x="100" y="210" font-family="monospace" font-size="12" fill="#92fe9d" text-anchor="middle">+ Add New Task</text>
  </g>

  <!-- title -->
  <text x="330" y="140" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="72" fill="url(#title)" filter="url(#glow)">TO-DO LIST APP</text>
  <text x="334" y="190" font-family="monospace" font-size="26" fill="#cfe8ef">Add · View · Delete Tasks</text>
  <text x="334" y="226" font-family="monospace" font-size="20" fill="#92fe9d">&gt; python todo.py<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#00c9ff" stroke-opacity="0.4" stroke-width="2"/>
</svg>
